{% extends 'base.html' %}{% block title %}Attendance{% endblock %}{% block content %}<small>RECORDS</small><h1>Attendance Report</h1><section class="card"><div class="scroll"><table><thead><tr><th>#</th><th>Name</th><th>Date</th><th>Time</th></tr></thead><tbody>{% for row in records %}<tr><td>{{ loop.index }}</td><td>{{ row.Name }}</td><td>{{ row.Date }}</td><td>{{ row.Time }}</td></tr>{% else %}<tr><td colspan="4">No records yet. Open the camera to begin.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
